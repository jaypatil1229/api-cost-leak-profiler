[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aclp-analytics"
version = "1.0.0"
description = "Independent semantic analysis service for ACLP"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3", "numpy>=1.26,<3", "scikit-learn>=1.5,<2",
  "python-dotenv>=1,<2"
]

[project.optional-dependencies]
semantic = ["sentence-transformers>=3.0,<6"]
test = ["pytest>=8,<9", "httpx>=0.27,<1"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
